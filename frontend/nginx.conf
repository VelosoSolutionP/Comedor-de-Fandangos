worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # log de acesso desligado: em dashboard com refresh de 60s isso vira
    # I/O de disco constante sem ninguem lendo.
    access_log off;
    error_log  /var/log/nginx/error.log warn;

    # -------------------------------------------------------------- gzip
    # Nivel 5: acima disso o ganho e marginal e a CPU sobe rapido.
    # serve os .gz gerados no build (zero CPU por request); cai no gzip
    # dinamico para o que nao tem versao pre-comprimida (respostas da API).
    gzip_static       on;
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/javascript
        text/css
        text/plain
        image/svg+xml;

    upstream backend {
        server app:8080;
        keepalive 32;          # reaproveita conexao com o WildFly
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------- API
        location /api/ {
            proxy_pass         http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # sem buffer no disco para respostas grandes de grid
            proxy_buffering  on;
            proxy_buffers    16 8k;
            proxy_busy_buffers_size 16k;
        }

        # -------------------------------------------------- assets estaticos
        # Os arquivos versionam junto com a imagem, entao 7 dias e seguro e o
        # ETag ainda revalida quando o build muda.
        location ~* \.(js|css|svg|png|jpg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # index.html NUNCA em cache: e ele que aponta para os assets novos
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ------------------------------------------------------------ SPA
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------------- headers
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header Referrer-Policy        "same-origin"  always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
